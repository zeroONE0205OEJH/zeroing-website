<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社zeroONE</title>

    <!-- URL共有時の表示設定 -->
    <meta property="og:title" content="株式会社zeroONE">
    <meta property="og:description" content="すべての荷物に、誠実な配送を。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="株式会社zeroONE">
    <meta name="twitter:description" content="すべての荷物に、誠実な配送を。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- 全体設定 --- */
        html { scroll-behavior: smooth; }
        body { background-color: #050505; color: #ffffff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 0; line-height: 1.6; overflow-x: hidden; }
        
        /* --- ヘッダー --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: rgba(5, 5, 5, 0.95); border-bottom: 1px solid #222; position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(10px); }
        
        .logo a { display: flex; align-items: center; text-decoration: none; }
        .logo img { height: 120px; width: auto; display: block; filter: invert(1); mix-blend-mode: screen; }

        nav.pc-nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 30px; }
        nav.pc-nav a { color: #888; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; }
        nav.pc-nav a:hover { color: #fff; }
        
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 6px; z-index: 10001; position: absolute; right: 25px; top: 50%; transform: translateY(-50%); }
        .hamburger span { display: block; width: 30px; height: 2px; background-color: #ffffff; transition: 0.4s; }
        
        .mobile-menu { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(5, 5, 5, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.4s; z-index: 9998; opacity: 0; pointer-events: none; }
        .mobile-menu.active { opacity: 1; pointer-events: auto; }
        .mobile-menu ul { list-style: none; padding: 0; text-align: center; }
        .mobile-menu li { margin-bottom: 40px; }
        .mobile-menu a { color: #fff; text-decoration: none; font-size: 26px; font-weight: bold; letter-spacing: 4px; }

        /* --- Heroエリア --- */
        .hero { text-align: center; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 0 20px; box-sizing: border-box; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-color: #050505; }
        .hero-video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }
        
        .hero-logo { width: 520px; max-width: 90vw; height: auto; margin-bottom: 20px; opacity: 0; transform: translateY(20px); animation: fadeInUp 1.5s forwards; filter: invert(1); mix-blend-mode: screen; }
        
        .hero p { 
            color: #ffffff; 
            font-weight: 800; 
            font-size: 20px; 
            margin: 0; 
            line-height: 1.8; 
            letter-spacing: 2px; 
            text-shadow: 0 2px 4px rgba(0,0,0,1), 0 0 15px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.8); 
            opacity: 0; 
            animation: fadeInUp 1.5s forwards 0.5s; 
            white-space: normal; 
            max-width: 800px; 
        }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* --- コンテンツセクション --- */
        .section { padding: 100px 20px; max-width: 1000px; margin: 0 auto; }
        .fade-in { opacity: 0; transform: translateY(40px); transition: 0.8s; }
        .fade-in.appear { opacity: 1; transform: translateY(0); }
        
        .news-item { display: flex; padding: 25px 0; border-bottom: 1px solid #222; gap: 30px; }
        .news-date { color: #888; font-size: 14px; min-width: 100px; }
        .news-tag { background: #fff; color: #000; font-size: 11px; padding: 3px 12px; border-radius: 2px; font-weight: bold; height: fit-content; }
        
        .greeting-box { text-align: center; }
        .greeting-box h2 { font-size: 32px; letter-spacing: 4px; margin-bottom: 60px; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .greeting-text { text-align: left; display: inline-block; max-width: 900px; }
        
        .greeting-text p { 
            font-family: 'Zen Kaku Gothic New', sans-serif; 
            font-weight: 500; 
            font-size: 22px; 
            color: #ffffff; 
            line-height: 2.2; 
            margin-bottom: 30px; 
            letter-spacing: 2px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .greeting-text strong {
            font-weight: 700;
        }
        
        .ib { display: inline-block; }

        .greeting-sign { 
            font-family: 'Zen Kaku Gothic New', sans-serif; 
            font-weight: 500;
            text-align: right; 
            margin-top: 80px; 
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.0; 
        }
        
        .sign-row {
            display: flex;
            align-items: flex-end; 
            justify-content: flex-end;
            gap: 15px; 
        }

        .greeting-sign .sign-title { font-size: 22px; margin-bottom: 4px; }
        .greeting-sign .sign-name { font-size: 48px; font-weight: 500; }

        /* --- フッター --- */
        footer { padding: 100px 20px 40px; text-align: center; border-top: 1px solid #222; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .footer-logo img { height: 120px; width: auto; filter: invert(1); mix-blend-mode: screen; } 
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .footer-links a { color: #888; text-decoration: none; font-size: 16px; transition: 0.3s; } 
        .footer-links a:hover { color: #fff; }
        .copyright { color: #444; font-size: 13px; margin-top: 20px; }

        /* --- スマホ対応 --- */
        @media (max-width: 900px) {
            header { 
                padding: 10px 15px 10px 0px; 
            }
            .logo {
                margin-left: -25px;
            }
            .logo img { height: 80px; }
            
            nav.pc-nav { display: none; }
            .hamburger { display: flex; }
            .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .hamburger.active span:nth-child(2) { opacity: 0; }
            .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

            .hero-logo { width: 320px; }
            .hero p { font-size: 15px; padding: 0 15px; line-height: 1.8; }
            .news-item { flex-direction: column; gap: 10px; }
            
            .greeting-text p { font-size: 16px; line-height: 2.0; margin-bottom: 25px; }
            .greeting-sign { margin-top: 50px; }
            .greeting-sign .sign-title { font-size: 16px; margin-bottom: 2px; }
            .greeting-sign .sign-name { font-size: 34px; }
            .sign-row { gap: 8px; }

            .sp-br-none { display: none; }
        }
    </style>
</head>
