<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy | 株式会社zeroONE</title>
    <style>
        /* --- 全体設定 --- */
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; line-height: 1.8; overflow-x: hidden; }
        
        /* --- ヘッダー（全ページ共通・右上固定仕様、透過をなくし、純黒 #000000 に修正） --- */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 40px; background-color: #000000; /* ロゴの背景と完全に一致させ枠を隠す */
            position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 9999; 
            border-bottom: 1px solid #222;
        }
        
        /* ★ロゴ画像の設定 */
        .logo a { display: flex; align-items: center; text-decoration: none; }
        .logo img { 
            height: 120px; 
            width: auto; 
            display: block; 
            filter: invert(1); 
            mix-blend-mode: screen; 
        }
        
        nav.pc-nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 30px; }
        nav.pc-nav a { color: #888; text-decoration: none; font-size: 14px; transition: 0.3s; font-weight: bold; }
        nav.pc-nav a:hover { color: #fff; }

        /* ハンバーガーボタン（右上に固定） */
        .hamburger { 
            display: none; cursor: pointer; flex-direction: column; gap: 6px; 
            z-index: 10000; position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
        }
        .hamburger span { display: block; width: 30px; height: 2px; background-color: #ffffff; transition: 0.4s; }

        /* スマホ用 全画面中央メニュー */
        .mobile-menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 10, 0.98); display: flex; justify-content: center; align-items: center;
            z-index: 9998; opacity: 0; pointer-events: none; transition: 0.4s;
        }
        .mobile-menu.active { opacity: 1; pointer-events: auto; }
        .mobile-menu ul { list-style: none; padding: 0; text-align: center; }
        .mobile-menu li { margin: 30px 0; }
        .mobile-menu a { color: #fff; text-decoration: none; font-size: 26px; font-weight: bold; letter-spacing: 4px; transition: 0.3s; }

        /* --- コンテンツ --- */
        .container { max-width: 800px; margin: 150px auto 100px; padding: 0 20px; }
        h1 { font-size: 32px; letter-spacing: 4px; margin-bottom: 60px; text-align: center; font-weight: 300; }
        h2 { font-size: 20px; margin-top: 50px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #fff; letter-spacing: 1px; }
        p { color: #ccc; font-size: 15px; margin-bottom: 20px; }
        ul.policy-list { color: #ccc; font-size: 15px; margin-bottom: 30px; padding-left: 20px; }
        ul.policy-list li { margin-bottom: 10px; }

        /* --- フッター --- */
        footer { padding: 80px 20px 40px; text-align: center; background: #000; border-top: 1px solid #111; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .footer-logo img { 
            height: 120px; 
            width: auto; 
            filter: invert(1); 
            mix-blend-mode: screen; 
        } 
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .footer-links a { color: #888; text-decoration: none; font-size: 16px; transition: 0.3s; } 
        .footer-links a:hover { color: #fff; }
        .copyright { color: #444; font-size: 13px; letter-spacing: 1px; margin-top: 20px; }

        /* --- レスポンシブ設定 --- */
        @media (max-width: 900px) {
            /* ★修正：他のページと同様に、左パディングを0にし、マイナスマージンで左端ギリギリに寄せる */
            header { padding: 10px 15px 10px 0px; background-color: #000000; }
            .logo { margin-left: -25px; }
            .logo img { height: 80px; } /* スマホ用ロゴも拡大 */
            
            nav.pc-nav { display: none; }
            .hamburger { display: flex; }
            
            /* 三本線が「×」になるアニメーション */
            .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .hamburger.active span:nth-child(2) { opacity: 0; }
            .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

            .container { margin-top: 120px; }
            h1 { font-size: 26px; }
            .footer-logo img { height: 80px; }
        }
    </style>
</head>
<body>
    
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="株式会社zeroONE">
            </a>
        </div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="pc-nav">
            <ul>
                <li><a href="index.html">Home
